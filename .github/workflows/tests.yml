name: Beat engine tests

# Reruns the test lab whenever index.html or the tests change, so an update that breaks
# tempo, beat or loop accuracy is flagged before anyone notices it on the site.
on:
  push:
    paths: ["index.html", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["index.html", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the test lab
        run: node tests/lab.js
      - name: Check flip modes, stab kit, filters and break finder
        run: node tests/flips.js
      - name: Check the Best tab picks
        run: node tests/best.js
