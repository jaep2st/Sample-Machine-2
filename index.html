<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Machine 2</title>
<meta name="description" content="Drop a track, get beat-snapped chops, seamless loops and one-shots. Runs in your browser.">
<meta name="theme-color" content="#e2412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sample Machine 2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23e2412b%27/%3E%3Crect x=%2714%27 y=%2714%27 width=%2715%27 height=%2715%27 rx=%273%27 fill=%27%23fff%27/%3E%3Crect x=%2735%27 y=%2714%27 width=%2715%27 height=%2715%27 rx=%273%27 fill=%27%23fff%27/%3E%3Crect x=%2714%27 y=%2735%27 width=%2715%27 height=%2715%27 rx=%273%27 fill=%27%23fff%27/%3E%3Crect x=%2735%27 y=%2735%27 width=%2715%27 height=%2715%27 rx=%273%27 fill=%27%23171614%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
/* VOICE everyday tool for a beatmaker, hardware-confident, no fluff
   IDEA a grey sampler body with dark rubber pads, like an MPC
   PICTURE the whole track as a chop map, chops lit as you browse and play
   COLOUR warm grey body, charcoal pads, signal red for selection, green for playing
   TYPE Archivo 800 + Archivo
   LAYOUT laptop: map across the top, pads left, editor sticky right; phone: map, pads, editor as a bottom sheet */
:root{color-scheme:light dark;--bg:light-dark(#e4e0d8,#1b1a18);--panel:light-dark(#f2efe9,#252320);--ink:light-dark(#171614,#eeeae3);--mute:light-dark(#625d55,#a39d93);--line:light-dark(#cbc5ba,#3a3732);--pad:light-dark(#2a2824,#34312c);--padink:#efebe4;--hot:#e2412b;--go:#36b37e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
.band{padding-inline:max(4vw,16px)}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-top:22px;padding-bottom:14px}
h1{font-weight:800;font-size:clamp(32px,6vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0}
header p{margin:4px 0 0;color:var(--mute)}
.load{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border-radius:12px;background:var(--hot);color:#fff;font-weight:600;cursor:pointer}
.load input{position:absolute;opacity:0;width:1px;height:1px}
.load:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.deck{background:var(--panel);border-block:1px solid var(--line);padding-block:14px}
.readout{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.tname{font-weight:800;font-size:20px;flex:1 1 220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:800;font-size:18px}
.mini{min-width:36px;min-height:36px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:600}
.fig{position:relative;height:clamp(110px,18vw,170px);border-radius:10px;background:var(--pad);overflow:hidden;touch-action:manipulation}
.fig>canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#status{margin:8px 0 0;color:var(--mute);font-size:14px;min-height:21px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{min-height:44px;padding:0 14px;border:0;background:none;cursor:pointer;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tabs{overflow-x:auto;max-width:100%}
.layout{display:grid;gap:18px;padding-block:14px 28px}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.editor{position:sticky;top:12px}}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.pad{position:relative;background:var(--pad);color:var(--padink);border-radius:12px;padding:10px 10px 8px;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 -3px 0 rgb(0 0 0/.35)}
.pad:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.pad[aria-current=true]{border-color:var(--hot)}
.pad.on{border-color:var(--go)}
.ptop{display:flex;align-items:center;gap:6px}
.pn{font-weight:800;font-size:22px;line-height:1}
.pt{font-size:13px;color:#b9b3a9;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pad canvas{display:block;width:100%;height:36px;margin:8px 0 6px}
.pbot{display:flex;justify-content:space-between;align-items:center}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:0;background:rgb(255 255 255/.1);color:var(--padink);cursor:pointer}
.ib:focus-visible,.mini:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.ib svg{width:18px;height:18px}
.pad.on .play{background:var(--go);color:#0b1f16}
.heart[aria-pressed=true]{color:var(--hot)}
.tag{font-size:13px;color:#b9b3a9}
.empty{grid-column:1/-1;padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--mute)}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.ehead{display:flex;align-items:center;gap:10px}
.ehead h2{font-size:24px;font-weight:800;margin:0;line-height:1.05;flex:1}
.estat{color:var(--mute);font-size:14px;margin:6px 0 10px;min-height:21px}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{background:var(--hot);color:#fff;border-color:var(--hot)}
.btn svg{width:16px;height:16px}
.brow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.field{margin:10px 0}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.field output{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:400}
input[type=range]{width:100%;height:32px;accent-color:var(--hot)}
.styles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.styles button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.styles button[aria-pressed=true]{background:var(--hot);color:#fff;border-color:var(--hot)}
.erow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.close{display:none}
@media(max-width:899px){.editor{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:64vh;overflow:auto;border-radius:16px 16px 0 0;border-bottom:0;box-shadow:0 -10px 30px rgb(0 0 0/.25);padding-bottom:max(16px,env(safe-area-inset-bottom))}.close{display:grid}body.sheet .layout{padding-bottom:66vh}}
.editor[hidden]{display:none}
.packs{border-top:1px solid var(--line);padding-block:18px 40px}
.packs h2{font-size:20px;margin:0 0 4px}
.packs p{margin:0 0 12px;color:var(--mute);font-size:14px}
.prow{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.isos .chopOnly{display:none}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div><h1>Sample Machine 2</h1><p>Drop a track. Get beat-snapped chops, loops and one-shots.</p></div>
  <label class="load" id="loadlbl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>Load a track<input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg"></label>
</header>
<section class="deck band">
  <div class="readout">
    <span class="tname" id="tname">Demo beat</span>
    <span class="chip">Key <b id="key">–</b></span>
    <span class="chip">BPM <b id="bpm">–</b>
      <button class="mini" id="half" aria-label="Halve tempo">½</button><button class="mini" id="dn" aria-label="Tempo down one">−</button><button class="mini" id="up" aria-label="Tempo up one">+</button><button class="mini" id="dbl" aria-label="Double tempo">×2</button></span>
    <span class="chip" id="len"></span>
  </div>
  <div class="fig" id="mapbox"><canvas id="map" aria-label="Chop map of the whole track. Tap to pick a chop."></canvas></div>
  <p id="status"></p>
</section>
<div class="band controls">
  <div class="seg" id="bars" aria-label="Bar length"><button data-b="1">1 bar</button><button data-b="2" aria-pressed="true">2 bars</button><button data-b="4">4</button><button data-b="8">8</button><button data-b="16">16</button></div>
  <div class="seg tabs" id="tabs"><button data-t="best" aria-pressed="true">Best</button><button data-t="weird">Weird</button><button data-t="all">All</button><button data-t="shots">One-shots</button><button data-t="favs">Favorites</button></div>
</div>
<main class="band layout">
  <div class="pads" id="pads"></div>
  <aside class="editor" id="editor" hidden>
    <div class="ehead"><h2 id="etitle">Chop</h2>
      <button class="ib heart" id="eheart" aria-pressed="false" aria-label="Favorite" style="background:var(--bg);color:var(--ink)"></button>
      <button class="ib close" id="eclose" aria-label="Close editor" style="background:var(--bg);color:var(--ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="estat" id="estat"></p>
    <div class="brow">
      <button class="btn main" id="ploop"></button>
      <button class="btn" id="ponce">Once</button>
      <button class="btn" id="pstop">Stop</button>
    </div>
    <div class="field chopOnly"><label for="shift">Shift whole chop <output id="o_shift"></output></label><input type="range" id="shift" min="-2" max="2" step="0.05"></div>
    <div class="field"><label for="ts">Trim start <output id="o_ts"></output></label><input type="range" id="ts" min="-0.5" max="0.5" step="0.01"></div>
    <div class="field"><label for="te">Trim end <output id="o_te"></output></label><input type="range" id="te" min="-0.5" max="0.5" step="0.01"></div>
    <div class="field"><label for="pitch">Pitch <output id="o_pitch"></output></label><input type="range" id="pitch" min="-12" max="12" step="1"></div>
    <div class="field chopOnly"><label for="tbpm">BPM <output id="o_tbpm"></output></label><input type="range" id="tbpm" step="1"></div>
    <div class="field"><label>Style</label></div>
    <div class="styles" id="styles"></div>
    <div class="erow" style="margin-bottom:8px">
      <button class="btn" id="rev" aria-pressed="false">Reverse: off</button>
      <button class="btn" id="rand">Randomize</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn red" id="save">Save</button>
    </div>
  </aside>
</main>
<section class="band packs">
  <h2>Packs</h2>
  <p>Each pack is a .zip of 16-bit WAVs, built with every chop's current tweaks. Everything runs on your device: your tracks are never uploaded anywhere.</p>
  <div class="prow">
    <button class="btn" id="zfav">Favorites</button>
    <button class="btn" id="zall">All chops</button>
    <button class="btn" id="zloop">Loops only</button>
    <button class="btn" id="zos">One-shots</button>
  </div>
</section>
<div id="toast" role="status"></div>
<script>
{
const KEYS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const STYLES=["Clean","Dusty","Warm","Dark","Tape","Crushed","Filtered","Lo-fi","Chorus"];
const MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const HOP=512,FR=1024,MAXSEC=600;
const $=id=>document.getElementById(id);
const ICON={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>',heartOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tick=()=>new Promise(r=>setTimeout(r,0));
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800)}
const S={y:null,sr:44100,name:"",dur:0,env:null,bpm:0,first:0,key:"",bars:2,sets:{},shots:[],best:[],weird:[],tab:"best",sel:null,params:{},cache:new Map(),wave:null,busy:false};
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem("sm-favs")||"[]"))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("sm-favs",JSON.stringify([...favs]))}catch(e){}};
const fk=id=>S.name+"|"+id;

/* ---------- DSP basics ---------- */
const hannC={};function hann(n){return hannC[n]||(hannC[n]=Float32Array.from({length:n},(_,i)=>0.5-0.5*Math.cos(2*Math.PI*i/n)))}
const fftC={};
function fft(re,im){const n=re.length;let t=fftC[n];if(!t){const bits=Math.log2(n),rev=new Uint32Array(n);for(let i=0;i<n;i++){let r=0,x=i;for(let b=0;b<bits;b++){r=(r<<1)|(x&1);x>>=1}rev[i]=r}const c=new Float64Array(n/2),s=new Float64Array(n/2);for(let i=0;i<n/2;i++){c[i]=Math.cos(2*Math.PI*i/n);s[i]=-Math.sin(2*Math.PI*i/n)}t=fftC[n]={rev,c,s}}
  const{rev,c,s}=t;for(let i=0;i<n;i++){const j=rev[i];if(j>i){let a=re[i];re[i]=re[j];re[j]=a;a=im[i];im[i]=im[j];im[j]=a}}
  for(let size=2;size<=n;size<<=1){const h=size>>1,st=n/size;for(let i=0;i<n;i+=size)for(let j=0,k=0;j<h;j++,k+=st){const l=i+j+h,tr=re[l]*c[k]-im[l]*s[k],ti=re[l]*s[k]+im[l]*c[k];re[l]=re[i+j]-tr;im[l]=im[i+j]-ti;re[i+j]+=tr;im[i+j]+=ti}}}
function movavg(x,k){const n=x.length,p=new Float64Array(n+1);for(let i=0;i<n;i++)p[i+1]=p[i]+x[i];const o=new Float32Array(n),h=Math.floor((k-1)/2);for(let i=0;i<n;i++){const a=Math.max(0,i-h),b=Math.min(n,i-h+k);o[i]=(p[b]-p[a])/k}return o}
function norm(x){let m=0;for(const v of x)m=Math.max(m,Math.abs(v));if(m>0){const g=0.92/m;for(let i=0;i<x.length;i++)x[i]*=g}return x}
function edgeFade(x,sr){const n=Math.min(Math.floor(sr*0.003),x.length>>2);for(let i=0;i<n;i++){const g=i/n;x[i]*=g;x[x.length-1-i]*=g}return x}
function fx(x,style,sr){if(x.length<100)return x;const th=(a,g,m)=>{for(let i=0;i<a.length;i++)a[i]=Math.tanh(a[i]*g)*m;return a};let o;
  switch(style){
  case"Dusty":return th(movavg(x,16),1.35,.84);
  case"Warm":{const l=movavg(x,7);o=new Float32Array(x.length);for(let i=0;i<x.length;i++)o[i]=x[i]*.7+l[i]*.4;return th(o,1.1,.95)}
  case"Dark":o=movavg(x,32);for(let i=0;i<o.length;i++)o[i]*=.6;return o;
  case"Tape":return th(movavg(x,8),1.28,.87);
  case"Crushed":o=new Float32Array(x.length);for(let i=0;i<x.length;i++)o[i]=Math.max(-.95,Math.min(.95,Math.round(x[i]*12)/12*1.4));return o;
  case"Filtered":{const l=movavg(x,20),h4=movavg(x,4);o=new Float32Array(x.length);for(let i=0;i<x.length;i++)o[i]=l[i]*.5+(x[i]-h4[i])*.6;return th(o,1.15,.9)}
  case"Lo-fi":o=movavg(x,12);for(let i=0;i<o.length;i++)o[i]+=(Math.random()*2-1)*.008;return th(o,1.2,.86);
  case"Chorus":{const d=Math.floor(.012*sr);o=new Float32Array(x.length);for(let i=0;i<x.length;i++)o[i]=x[i]*.7+(i>=d?x[i-d]:0)*.35;return th(o,1.05,.93)}}
  return x}
/* WSOLA time-stretch: rate>1 = shorter */
function stretch(x,rate){if(Math.abs(rate-1)<1e-3||x.length<4096)return x;const N=2048,Hs=1024,tol=512,w=hann(N),outLen=Math.floor(x.length/rate),out=new Float32Array(outLen+N),ws=new Float32Array(outLen+N);let prev=0;
  for(let k=0;k*Hs<outLen;k++){const nom=Math.round(k*Hs*rate);let pos=Math.min(nom,x.length-1);
    if(k>0){const tgt=prev+Hs,lo=Math.max(0,nom-tol),hi=Math.min(x.length-N,nom+tol);let best=-Infinity;for(let c=lo;c<=hi;c+=2){let s=0;for(let i=0;i<N;i+=8)s+=(x[tgt+i]||0)*x[c+i];if(s>best){best=s;pos=c}}}
    const o=k*Hs;for(let i=0;i<N;i++){out[o+i]+=(x[pos+i]||0)*w[i];ws[o+i]+=w[i]}prev=pos}
  const r=new Float32Array(outLen);for(let i=0;i<outLen;i++)r[i]=ws[i]>1e-3?out[i]/ws[i]:0;return r}
function resample(x,f){if(f===1)return x;const n=Math.floor(x.length/f),o=new Float32Array(n);for(let i=0;i<n;i++){const p=i*f,a=Math.floor(p),t=p-a;o[i]=(x[a]||0)*(1-t)+(x[a+1]||0)*t}return o}
function makeLoop(seg,sr,reps=4){const o=new Float32Array(seg.length*reps);for(let r=0;r<reps;r++)o.set(seg,r*seg.length);return o}

/* ---------- files ---------- */
/* 16-bit WAV with an ACID chunk: tempo, beat count and root key, read by FL Studio, Ableton and other DAWs */
function wav(seg,sr,meta,reps=1){const n=seg.length,ac=meta?32:0,b=new ArrayBuffer(44+ac+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+ac+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  let o=36;if(meta){w(o,"acid");v.setUint32(o+4,24,true);v.setUint32(o+8,meta.one?0x03:0x06,true);v.setUint16(o+12,60+Math.max(0,meta.root),true);v.setUint16(o+14,0x8000,true);v.setFloat32(o+16,0,true);v.setUint32(o+20,meta.one?0:meta.beats*reps,true);v.setUint16(o+24,4,true);v.setUint16(o+26,4,true);v.setFloat32(o+28,meta.bpm,true);o+=32}
  w(o,"data");v.setUint32(o+4,n*2,true);o+=8;for(let i=0;i<n;i++,o+=2){const x=Math.max(-1,Math.min(1,seg[i]));v.setInt16(o,x<0?x*32768:x*32767,true)}return new Uint8Array(b)}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0,cs=0;const used=new Set();

    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,len,true);h.setUint32(22,len,true);h.setUint16(26,n.length,true);parts.push(new Uint8Array(h.buffer),n,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,len,true);c.setUint32(24,len,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);cen.push(new Uint8Array(c.buffer),n);cs+=46+n.length;off+=30+n.length+len}
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob([...parts,...cen,new Uint8Array(e.buffer)])}
let dlP=null;function downloads(){if(!dlP)dlP=(window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null)).catch(()=>null);return dlP}
function plainSave(filename,blob){const u=URL.createObjectURL(blob),el=document.createElement("a");el.href=u;el.download=filename;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function saveZip(filename,files){const dl=await downloads();
  if(!dl){/* on your own website: WAVs download directly, packs as a zip */try{if(files.length===1)plainSave(files[0].name,new Blob([files[0].data],{type:"audio/wav"}));else plainSave(filename,zip(files));toast("Saved")}catch(e){toast("Couldn't save that file")}return}
  try{await dl.save({filename,data:zip(files)});toast("Saved "+filename)}catch(e){const c=e&&e.code;toast(c==="declined"?"Save cancelled":c==="rate_limited"?"One save at a time, try again in a moment":c==="host_unavailable"?"This app can't save files. Open the page in a browser.":"Couldn't save that file")}}

/* ---------- analysis ---------- */
function shiftKey(k,n){if(!n)return k;const[r,m]=k.split(" ");return KEYS[((KEYS.indexOf(r)+n)%12+12)%12]+" "+m}
async function onsetEnv(y,sr){const frames=Math.max(1,Math.floor((y.length-FR)/HOP)+1),env=new Float32Array(frames),low=new Float32Array(frames),lb=Math.max(2,Math.round(200*FR/sr)),w=hann(FR),prev=new Float32Array(FR/2),re=new Float64Array(FR),im=new Float64Array(FR),top=FR/4;

    if(f%3000===0){status(`Finding the tempo… ${Math.round(f/frames*100)}%`);await tick()}}
  S.low=low;return env}
function tempo(env,fps){const n=env.length;let mean=0;for(const v of env)mean+=v;mean/=n;const e=Float32Array.from(env,v=>v-mean),minL=Math.floor(fps*60/190),maxL=Math.ceil(fps*60/55),ac=new Float64Array(maxL+2);

  let best=minL,bv=-Infinity;for(let L=minL;L<=maxL;L++){const z=Math.log2(60*fps/L/110)/0.9,v=ac[L]*Math.exp(-0.5*(z**2));if(v>bv){bv=v;best=L}}
  const a=ac[best-1],b=ac[best],c=ac[best+1],den=a-2*b+c,lag=best+(den<0?0.5*(a-c)/den:0);let bpm=60*fps/lag;if(bpm>145)bpm/=2;else if(bpm<72)bpm*=2;return bpm}
function gridFit(env,P){let ph=0,bv=-1;for(let p=0;p<P;p+=0.5){let s=0;for(let t=p;t<env.length;t+=P)s+=env[Math.round(t)]||0;if(s>bv){bv=s;ph=p}}return[ph,bv]}
function refine(env,fps,bpm){let best=bpm,bv=-1;for(let k=-24;k<=24;k++){const b=bpm*(1+k*0.0005),v=gridFit(env,fps*60/b)[1]/(env.length/(fps*60/b));if(v>bv){bv=v;best=b}}return best}
function phase(env,fps,bpm){const P=fps*60/bpm,[ph]=gridFit(env,P),low=S.low||env;
  let db=0,dv=-1;for(let k=0;k<4;k++){let s=0;for(let t=ph+k*P;t<low.length;t+=4*P)s+=low[Math.round(t)]||0;if(s>dv){dv=s;db=k}}
  return(ph+db*P)/fps+FR/2/S.sr-0.006}
function detectKey(y,sr){const N=8192,frames=Math.max(1,Math.min(240,Math.floor(y.length/N)-1)),step=Math.max(1,Math.floor((y.length-N)/frames)),w=hann(N),re=new Float64Array(N),im=new Float64Array(N),ch=new Float64Array(12),lo=Math.ceil(55*N/sr),hi=Math.min(N/2,Math.floor(2000*N/sr));
  for(let f=0;f<frames;f++){const o=f*step;for(let i=0;i<N;i++){re[i]=(y[o+i]||0)*w[i];im[i]=0}fft(re,im);const fr=new Float64Array(12);let tot=0;for(let b=lo;b<hi;b++){const m=Math.sqrt(re[b]*re[b]+im[b]*im[b]),pc=((Math.round(12*Math.log2(b*sr/N/440))+69)%12+12)%12;fr[pc]+=m;tot+=m}if(tot>0)for(let i=0;i<12;i++)ch[i]+=fr[i]/tot}
  const corr=(a,b)=>{const ma=a.reduce((s,v)=>s+v,0)/12,mb=b.reduce((s,v)=>s+v,0)/12;let n=0,da=0,dbb=0;for(let i=0;i<12;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;dbb+=(b[i]-mb)**2}return n/Math.sqrt(da*dbb||1)};
  let best=[-2,"C","major"];for(let i=0;i<12;i++)for(const[p,m]of[[MAJ,"major"],[MIN,"minor"]]){const r=corr(ch,KEYS.map((_,j)=>p[((j-i)%12+12)%12]));if(r>best[0])best=[r,KEYS[i],m]}
  return best[1]+" "+best[2]}
function scoreChop(s,e){const y=S.y,sr=S.sr,a=Math.floor(s*sr),b=Math.min(y.length,Math.floor(e*sr));if(b-a<100)return 0;let sum=0,c=0;for(let i=a;i<b;i+=4){sum+=Math.abs(y[i]);c++}const rms=sum/c,energy=Math.max(0,1-Math.abs(rms-.11)*4);
  let d=0;const tb=Math.min(b,a+Math.floor(.1*sr));for(let i=a+1;i<tb;i++)d+=Math.abs(y[i]-y[i-1]);const tr=Math.min(1,d/Math.max(1,tb-a-1)*8),pos=1-s/S.dur*.4;
  let w=0,wc=0;for(let i=Math.max(0,a-Math.floor(.05*sr));i<Math.min(y.length,a+Math.floor(.1*sr));i++){w+=Math.abs(y[i]);wc++}const on=Math.min(1,(wc?w/wc:0)*3);return Math.max(0,energy*.4+tr*.25+pos*.2+on*.15)}
function chopSet(bars){if(S.sets[bars])return S.sets[bars];const bar=bars*4*60/S.bpm;let st=S.first;const one=4*60/S.bpm;while(st-one>=-0.02)st-=one;st=Math.max(0,st);
  const out=[];for(let i=1;st+bar<=S.dur+0.02&&i<=80;i++,st+=bar){const e=Math.min(S.dur,st+bar);out.push({id:`c${bars}_${i}`,kind:"chop",n:i,start:st,end:e,score:scoreChop(st,e)})}return S.sets[bars]=out}
function findShots(){const{env,y,sr}=S;let m=0;for(const v of env)m+=v;m/=env.length;let sd=0;for(const v of env)sd+=(v-m)**2;sd=Math.sqrt(sd/env.length);const th=m+1.2*sd,c=[],B=Math.floor(.01*sr);
  for(let f=3;f<env.length-3;f++){const v=env[f];if(v<th)continue;let pk=true;for(let k=-3;k<=3;k++)if(env[f+k]>v){pk=false;break}if(!pk)continue;const t=Math.max(0,f*HOP/sr-.005),a=Math.floor(t*sr);if(a+80*B>y.length)continue;
    const blk=new Float32Array(80);let peak=0;for(let j=0;j<80;j++){let s=0;for(let i=0;i<B;i+=2)s+=Math.abs(y[a+j*B+i]);blk[j]=s/(B/2);peak=Math.max(peak,blk[j])}
    let len=.8;for(let j=10;j<80;j++)if(blk[j]<peak*.3){len=j/100;break}len=Math.max(.15,Math.min(.8,len));let hit=0;for(let j=0;j<8;j++)hit+=blk[j]/8;c.push({t,len,sc:hit*peak})}
  c.sort((a,b)=>b.sc-a.sc);const pick=[];for(const x of c){if(pick.length>=12)break;if(pick.every(p=>Math.abs(p.t-x.t)>.25))pick.push(x)}
  return pick.map((x,i)=>({id:`os_${i+1}`,kind:"os",n:i+1,start:x.t,end:x.t+x.len}))}
function buildWave(){const n=1600,y=S.y,b=Math.max(1,Math.floor(y.length/n)),w=new Float32Array(n);for(let i=0;i<n;i++){let m=0;const a=i*b,e=Math.min(y.length,a+b);for(let j=a;j<e;j+=4)m=Math.max(m,Math.abs(y[j]));w[i]=m}S.wave=w}

async function analyse(y,sr,name){S.busy=true;stopPlay();S.y=y.length>MAXSEC*sr?y.slice(0,MAXSEC*sr):y;S.sr=sr;S.name=name;S.dur=S.y.length/sr;S.sets={};S.params={};S.cache.clear();S.sel=null;
  $("tname").textContent=name;$("len").textContent=fmt(S.dur);$("key").textContent="…";$("bpm").textContent="…";$("pads").innerHTML="";closeEditor();buildWave();drawMap();
  S.env=await onsetEnv(S.y,sr);setBpm(refine(S.env,sr/HOP,tempo(S.env,sr/HOP)),true);status("Reading the key…");await tick();S.key=detectKey(S.y,sr);$("key").textContent=S.key;
  S.shots=findShots();status(y.length>MAXSEC*sr?"Over 10 minutes, so only the first 10 were chopped.":"");S.busy=false;refresh()}
function setBpm(b,fresh){S.bpm=Math.max(40,Math.min(200,b));if(S.env)S.first=phase(S.env,S.sr/HOP,S.bpm);S.sets={};S.params={};S.cache.clear();$("bpm").textContent=Math.round(S.bpm);if(!fresh){S.sel=null;closeEditor();stopPlay();refresh()}}
function rank(){const all=chopSet(S.bars),sc=[...all].sort((a,b)=>b.score-a.score);S.best=sc.slice(0,Math.max(6,Math.floor(sc.length/3)));const bi=new Set(S.best.map(c=>c.id));S.weird=sc.filter(c=>!bi.has(c.id)).slice(-8).reverse()}

function tabItems(){switch(S.tab){case"best":return S.best;case"weird":return S.weird;case"all":return chopSet(S.bars);case"shots":return S.shots;case"favs":return[...favs].filter(k=>k.startsWith(S.name+"|")).map(k=>byId(k.slice(S.name.length+1))).filter(Boolean)}return[]}

/* ---------- render a chop with its tweaks ---------- */
const base=()=>({shift:0,ts:0,te:0,pitch:0,bpm:Math.round(S.bpm),rev:false,style:"Clean",rand:false});
const P=id=>S.params[id]||(S.params[id]=base());
function render(it){const p=P(it.id),k=it.id+JSON.stringify(p);if(S.cache.has(k))return S.cache.get(k);const sr=S.sr,chop=it.kind==="chop";
  let s=it.start+(chop?p.shift:0)+p.ts,e=it.end+(chop?p.shift:0)+p.te;s=Math.max(0,Math.min(s,S.dur-.05));e=Math.max(s+.05,Math.min(e,S.dur));
  const st=[],bb=Math.round(S.bpm),f=Math.pow(2,p.pitch/12),ratio=chop?S.bpm/p.bpm:1;
  /* exact loop length: the chop conformed to the BPM in its file name, to the sample */
  const L=Math.max(64,Math.round((e-s)*sr*ratio));
  /* grab extra audio past the seam (before it, when reversed) to crossfade the loop point */
  const pad=chop?.06:0,a0=p.rev?Math.max(0,s-pad):s,a1=p.rev?e:Math.min(S.dur,e+pad);
  let x=S.y.slice(Math.floor(a0*sr),Math.floor(a1*sr)),key=S.key;
  if(p.pitch)x=resample(stretch(x,1/(ratio*f)),f);
  else if(Math.abs(ratio-1)>1e-6)x=Math.abs(ratio-1)<.02?resample(x,1/ratio):stretch(x,1/ratio);
  if(p.rand)st.push("Randomized");
  if(p.pitch){key=shiftKey(S.key,p.pitch);st.push(`${p.pitch>0?"+":""}${p.pitch} st → ${key}`)}
  if(chop&&p.bpm!==bb)st.push(`${p.bpm} BPM`);
  if(p.rev){x.reverse();st.push("Reversed")}
  if(p.style!=="Clean"){x=fx(x,p.style,sr);st.push(p.style)}

  if(chop){if(x.length<L){const z=new Float32Array(L);z.set(x);x=z}seg=x.slice(0,L);const tail=x.subarray(L),cf=Math.min(tail.length,Math.floor(.02*sr),L>>2);
    if(cf>=32){for(let i=0;i<cf;i++){const t=(i+.5)/cf*Math.PI/2;seg[i]=seg[i]*Math.sin(t)+tail[i]*Math.cos(t)}st.push("Seamless loop")}else edgeFade(seg,sr)}
  else{seg=x;const fi=Math.min(Math.floor(.002*sr),seg.length>>3),fo=Math.min(Math.floor(.015*sr),seg.length>>2);for(let i=0;i<fi;i++)seg[i]*=i/fi;for(let i=0;i<fo;i++)seg[seg.length-1-i]*=i/fo}

  if(p.pitch)name+=`_p${p.pitch>0?"+":""}${p.pitch}`;if(p.rev)name+="_rev";if(p.style!=="Clean")name+="_"+p.style.toLowerCase().replace("-","");
  const meta={bpm:chop?p.bpm:bb,root:KEYS.indexOf(key.split(" ")[0]),beats:chop?Math.max(1,Math.round(seg.length/sr*p.bpm/60)):0,one:!chop};const r={seg,name,st,s,e,meta};if(S.cache.size>150)S.cache.clear();S.cache.set(k,r);return r}

/* ---------- playback ---------- */
let ctx=null,cur=null,raf=0;
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
/* a silent looping media element keeps iPhones playing sound with the silent switch on */
const AE=new Audio(URL.createObjectURL(new Blob([wav(new Float32Array(4410),44100)],{type:"audio/wav"})));AE.loop=true;AE.setAttribute("playsinline","");
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}if(AE.paused){const q=AE.play();if(q&&q.catch)q.catch(()=>{})}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){AE.pause();stopPlay()}});
/* sample-accurate looping: the buffer repeats with no gap */
function play(it,loop){stopPlay();unlock();const r=render(it),c=ac(),b=c.createBuffer(1,r.seg.length,S.sr);b.copyToChannel(r.seg,0);const src=c.createBufferSource();src.buffer=b;src.loop=loop;src.connect(c.destination);src.start();
  cur={id:it.id,src,t0:c.currentTime,len:b.duration,loop,s:r.s,e:r.e,rev:P(it.id).rev};src.onended=()=>{if(cur&&cur.src===src){cur=null;playUI()}};playUI();cancelAnimationFrame(raf);raf=requestAnimationFrame(anim)}
function stopPlay(){if(cur){try{cur.src.stop()}catch(e){}cur=null}playUI()}
function anim(){drawMap();if(cur)raf=requestAnimationFrame(anim)}
function playUI(){for(const el of document.querySelectorAll(".pad")){const on=cur&&cur.id===el.dataset.id;el.classList.toggle("on",!!on);const b=el.querySelector(".play");b.innerHTML=on?ICON.stop:ICON.play;b.setAttribute("aria-label",on?"Stop":"Play loop")}
  const on=cur&&S.sel&&cur.id===S.sel.id&&cur.loop;$("ploop").innerHTML=(on?ICON.stop+"Stop loop":ICON.play+"Loop");drawMap()}

/* ---------- drawing ---------- */
const css=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
function fit(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));return[cv.getContext("2d"),cv.width,cv.height,d]}
function drawMap(){const cv=$("map");if(!S.wave)return;const[g,W,H,d]=fit(cv);g.clearRect(0,0,W,H);const hot=css("--hot"),go=css("--go"),w=S.wave,mid=H/2,X=t=>t/S.dur*W;
  const vis=S.busy?[]:tabItems();g.fillStyle=hot+"38";for(const it of vis)g.fillRect(X(it.start),0,Math.max(1,X(it.end)-X(it.start)),H);
  if(S.sel){g.fillStyle=hot+"aa";g.fillRect(X(S.sel.start),0,Math.max(2,X(S.sel.end)-X(S.sel.start)),H)}
  g.fillStyle="#d9d3c9";for(let i=0;i<w.length;i++){const x=i/w.length*W,h=Math.max(1,w[i]*mid*.92);g.fillRect(x,mid-h,Math.max(1,W/w.length),h*2)}
  if(!S.busy&&S.tab!=="shots"){g.fillStyle="rgba(255,255,255,.22)";for(const c of chopSet(S.bars))g.fillRect(X(c.start),0,d,H)}
  if(cur&&ctx){const el=(ctx.currentTime-cur.t0)/cur.len,fr=cur.loop?el%1:Math.min(1,el),t=cur.rev?cur.e-fr*(cur.e-cur.s):cur.s+fr*(cur.e-cur.s);g.fillStyle=go;g.fillRect(X(t)-d,0,2*d,H)}}
function drawPad(cv,it){const[g,W,H]=fit(cv);const y=S.y,a=Math.floor(it.start*S.sr),b=Math.floor(it.end*S.sr),n=Math.max(1,W),per=(b-a)/n,st=Math.max(1,Math.floor(per/24));g.fillStyle=it.kind==="os"?"#f08a78":"#bdb6ab";
  for(let i=0;i<n;i++){let m=0;const s=a+Math.floor(i*per),e=Math.min(b,s+Math.ceil(per));for(let j=s;j<e;j+=st)m=Math.max(m,Math.abs(y[j]));const h=Math.max(1,m*H*.48);g.fillRect(i,H/2-h,1,h*2)}}
const fmt=t=>`${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,"0")}`;

/* ---------- UI ---------- */
function status(m){$("status").textContent=m}
function refresh(){if(S.busy)return;rank();const its=tabItems(),pads=$("pads");
  if(!its.length){pads.innerHTML=`<div class="empty">${S.tab==="favs"?"No favorites yet. Tap the heart on a pad and it lands here.":"Nothing here at this bar length. Try a shorter one."}</div>`}
  else pads.innerHTML=its.map(it=>{const f=favs.has(fk(it.id));const tag=it.kind==="os"?"One-shot":S.tab==="favs"?it.id.slice(1).split("_")[0]+" bar":"";return`<div class="pad" role="button" tabindex="0" data-id="${esc(it.id)}" aria-current="${S.sel&&S.sel.id===it.id}"><div class="ptop"><span class="pn">${it.n}</span><span class="tag">${esc(tag)}</span><span class="pt">${fmt(it.start)}</span></div><canvas></canvas><div class="pbot"><button class="ib play" aria-label="Play loop">${ICON.play}</button><button class="ib heart" aria-pressed="${f}" aria-label="Favorite">${f?ICON.heartOn:ICON.heart}</button></div></div>`}).join("");
  for(const el of pads.querySelectorAll(".pad"))drawPad(el.querySelector("canvas"),byId(el.dataset.id));
  playUI();drawMap()}
function toggleFav(id){const k=fk(id);favs.has(k)?favs.delete(k):favs.add(k);saveFavs();if(S.tab==="favs")refresh();else{const el=document.querySelector(`.pad[data-id="${CSS.escape(id)}"] .heart`);if(el){const f=favs.has(k);el.setAttribute("aria-pressed",f);el.innerHTML=f?ICON.heartOn:ICON.heart}}heartUI()}
function heartUI(){if(!S.sel)return;const f=favs.has(fk(S.sel.id)),h=$("eheart");h.setAttribute("aria-pressed",f);h.innerHTML=f?ICON.heartOn:ICON.heart;h.style.color=f?"var(--hot)":"var(--ink)"}
$("styles").innerHTML=STYLES.map(s=>`<button data-s="${s}">${s}</button>`).join("");
function select(it){S.sel=it;for(const el of document.querySelectorAll(".pad"))el.setAttribute("aria-current",el.dataset.id===it.id);openEditor();drawMap()}
function openEditor(){const it=S.sel,p=P(it.id),ed=$("editor");ed.hidden=false;document.body.classList.add("sheet");ed.classList.toggle("isos",it.kind==="os");
  $("etitle").textContent=(it.kind==="os"?"One-shot ":"Chop ")+it.n;const t=$("tbpm"),bb=Math.round(S.bpm);t.min=Math.max(40,bb-40);t.max=Math.min(200,bb+40);
  for(const f of["shift","ts","te","pitch"])$(f).value=p[f];t.value=p.bpm;$("rev").setAttribute("aria-pressed",p.rev);$("rev").textContent="Reverse: "+(p.rev?"on":"off");
  for(const b of $("styles").children)b.setAttribute("aria-pressed",b.dataset.s===p.style);labels();heartUI();estat();playUI()}
function closeEditor(){$("editor").hidden=true;document.body.classList.remove("sheet")}
function labels(){const p=P(S.sel.id),sg=v=>(v>0?"+":"")+v;$("o_shift").textContent=sg(p.shift.toFixed(2))+" s";$("o_ts").textContent=sg(p.ts.toFixed(2))+" s";$("o_te").textContent=sg(p.te.toFixed(2))+" s";$("o_pitch").textContent=p.pitch?sg(p.pitch)+" st":"0";$("o_tbpm").textContent=p.bpm}
let rt;function estat(){clearTimeout(rt);$("estat").textContent="Rendering…";rt=setTimeout(()=>{const r=render(S.sel);$("estat").textContent=`${fmt(r.s)} to ${fmt(r.e)} · ${(r.seg.length/S.sr).toFixed(2)} s${r.st.length?" · "+r.st.join(" · "):""}`;if(cur&&cur.id===S.sel.id&&cur.loop)play(S.sel,true)},180)}
function changed(){S.params[S.sel.id].rand=false;labels();estat()}
for(const f of["shift","ts","te","pitch","tbpm"])$(f).addEventListener("input",e=>{const p=P(S.sel.id);p[f==="tbpm"?"bpm":f]=Number(e.target.value);changed()});
$("styles").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;P(S.sel.id).style=b.dataset.s;for(const x of $("styles").children)x.setAttribute("aria-pressed",x===b);changed()});
$("rev").onclick=()=>{const p=P(S.sel.id);p.rev=!p.rev;openEditor();changed()};
$("rand").onclick=()=>{const p=P(S.sel.id),pk=a=>a[Math.floor(Math.random()*a.length)];Object.assign(p,{pitch:pk([-5,-3,-2,2,3,5,7]),rev:pk([true,false]),style:pk(STYLES.slice(1))});openEditor();p.rand=true;labels();estat()};
$("reset").onclick=()=>{S.params[S.sel.id]=base();openEditor()};
$("ploop").onclick=()=>{cur&&cur.id===S.sel.id&&cur.loop?stopPlay():play(S.sel,true)};
$("ponce").onclick=()=>play(S.sel,false);$("pstop").onclick=stopPlay;$("eclose").onclick=closeEditor;$("eheart").onclick=()=>toggleFav(S.sel.id);
$("save").onclick=()=>{const it=S.sel,r=render(it),files=[{name:r.name+".wav",data:wav(r.seg,S.sr,r.meta)}];if(it.kind==="chop")files.push({name:r.name+"_loop.wav",data:wav(makeLoop(r.seg,S.sr),S.sr,r.meta,4)});saveZip(r.name+".zip",files)};
$("pads").addEventListener("click",e=>{const el=e.target.closest(".pad");if(!el)return;const it=byId(el.dataset.id);if(e.target.closest(".play")){cur&&cur.id===it.id?stopPlay():play(it,true);return}if(e.target.closest(".heart")){toggleFav(it.id);return}select(it)});
$("pads").addEventListener("keydown",e=>{const el=e.target.closest(".pad");if(el&&e.target===el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(byId(el.dataset.id))}});
document.addEventListener("keydown",e=>{if(e.key===" "&&S.sel&&!e.target.closest(".pad,button,input")){e.preventDefault();$("ploop").click()}});
$("bars").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||S.busy)return;S.bars=Number(b.dataset.b);for(const x of $("bars").children)x.setAttribute("aria-pressed",x===b);if(S.sel&&S.sel.kind==="chop"&&S.tab!=="favs"){S.sel=null;closeEditor()}refresh()});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.t;for(const x of $("tabs").children)x.setAttribute("aria-pressed",x===b);refresh()});
$("map").addEventListener("click",e=>{if(S.busy||!S.wave)return;const r=e.currentTarget.getBoundingClientRect(),t=(e.clientX-r.left)/r.width*S.dur,list=[...tabItems(),...chopSet(S.bars)],it=list.find(i=>t>=i.start&&t<i.end);if(it){select(it);play(it,true)}});
$("half").onclick=()=>!S.busy&&setBpm(S.bpm/2);$("dbl").onclick=()=>!S.busy&&setBpm(S.bpm*2);$("dn").onclick=()=>!S.busy&&setBpm(Math.round(S.bpm)-1);$("up").onclick=()=>!S.busy&&setBpm(Math.round(S.bpm)+1);
async function packs(kind){if(S.busy)return;status("Building pack…");await tick();let files=[],fn;
  if(kind==="fav"){const its=[...favs].filter(k=>k.startsWith(S.name+"|")).map(k=>byId(k.slice(S.name.length+1))).filter(Boolean);if(!its.length){status("");toast("No favorites yet");return}files=its.map(it=>{const r=render(it);return{name:r.name+".wav",data:wav(r.seg,S.sr,r.meta)}});fn="favorites"}
  else if(kind==="os"){files=S.shots.map(it=>{const r=render(it);return{name:r.name+".wav",data:wav(r.seg,S.sr,r.meta)}});fn="oneshots"}
  else{const cs=chopSet(S.bars);for(const it of cs){const r=render(it);files.push(kind==="loop"?{name:r.name+"_loop.wav",data:wav(makeLoop(r.seg,S.sr),S.sr,r.meta,4)}:{name:r.name+".wav",data:wav(r.seg,S.sr,r.meta)});if(files.length%8===0)await tick()}fn=kind==="loop"?"loops_only":"all_chops"}
  status("");saveZip(`${S.name.replace(/[^\w-]+/g,"_")}_${fn}.zip`,files)}
$("zfav").onclick=()=>packs("fav");$("zall").onclick=()=>packs("all");$("zloop").onclick=()=>packs("loop");$("zos").onclick=()=>packs("os");
$("file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;e.target.value="";status("Decoding…");try{const buf=await ac().decodeAudioData(await f.arrayBuffer());const n=buf.length,y=new Float32Array(n);for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)y[i]+=d[i]/buf.numberOfChannels}await analyse(y,buf.sampleRate,f.name.replace(/\.[^.]+$/,""))}catch(err){S.busy=false;status("Couldn't read that file. Try an mp3, wav or m4a.")}});
document.addEventListener("dragover",e=>e.preventDefault());document.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){const dt=new DataTransfer();dt.items.add(f);$("file").files=dt.files;$("file").dispatchEvent(new Event("change"))}});
const ro=new ResizeObserver(()=>{drawMap();for(const el of document.querySelectorAll(".pad"))drawPad(el.querySelector("canvas"),byId(el.dataset.id))});ro.observe($("mapbox"));

/* ---------- demo beat so the machine opens mid-use ---------- */
function demo(){const sr=44100,bpm=92,beat=60/bpm,bars=16,n=Math.floor(bars*4*beat*sr),y=new Float32Array(n);let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647*2-1;
  const chords=[[57,60,64,67],[53,57,60,64],[50,53,57,60],[52,56,59,62]],hz=m=>440*Math.pow(2,(m-69)/12);
  for(let b=0;b<bars;b++){const ch=chords[b%4],t0=Math.floor(b*4*beat*sr),L=Math.floor(4*beat*sr),bre=b>=8&&b<10;
    for(let i=0;i<L&&t0+i<n;i++){const t=i/sr,env=Math.min(1,t*8)*Math.exp(-t*0.35);let s=0;for(const m of ch)s+=Math.sin(2*Math.PI*hz(m)*t)*.07+Math.sin(4*Math.PI*hz(m)*t)*.015;s+=Math.sin(2*Math.PI*hz(ch[0]-24)*t)*.22*Math.exp(-((i/sr)%(2*beat))*1.6);y[t0+i]+=s*env}
    if(bre)continue;
    for(let k=0;k<8;k++){const at=t0+Math.floor(k*beat/2*sr);const kick=k===0||k===3&&b%2===1||k===4||k===5&&b%4===3;const snare=k===2||k===6;
      for(let i=0;i<Math.floor(.35*sr)&&at+i<n;i++){const t=i/sr;let s=0;if(kick)s+=Math.sin(2*Math.PI*(50+90*Math.exp(-t*30))*t)*Math.exp(-t*9)*.9;if(snare)s+=(rnd()*.5*Math.exp(-t*18)+Math.sin(2*Math.PI*190*t)*.3*Math.exp(-t*25));if(t<.06)s+=rnd()*.12*Math.exp(-t*80)*(k%2?1:.6);y[at+i]+=s}}}
  norm(y);return y}
downloads();
analyse(demo(),44100,"Demo beat").then(()=>{status("Demo beat made in your browser. Load your own track above.");const f=S.best[0];if(f){S.sel=f;if(matchMedia("(min-width:900px)").matches)openEditor();refresh()}});
}
